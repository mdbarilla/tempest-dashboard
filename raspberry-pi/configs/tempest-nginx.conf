# ── PUBLIC: towerhill.app ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name towerhill.app;
    add_header Permissions-Policy "local-network-access=()" always;
    root /home/mbarilla/deployment/dashboard;
    index index.html;

    # /guest is local-network only
    location /guest {
        return 403;
    }

    # index.html — never cache (so new deploys are picked up immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Permissions-Policy "local-network-access=()" always;
    }

    # Hashed static assets — cache forever (hash changes on every build)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Permissions-Policy "local-network-access=()" always;
    }

    location = /garden { return 301 /garden/; }
    location /garden/ {
        alias /home/mbarilla/deployment/garden/;
        try_files $uri $uri/ /garden/index.html;
    }
    location /garden/index.html {
        alias /home/mbarilla/deployment/garden/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── LOCAL: towerhill.local + IP + fallback ────────────────────────────────────
server {
    listen 80 default_server;
    server_name towerhill.local 192.168.1.160 _;
    add_header Permissions-Policy "local-network-access=()" always;
    root /home/mbarilla/deployment/dashboard;
